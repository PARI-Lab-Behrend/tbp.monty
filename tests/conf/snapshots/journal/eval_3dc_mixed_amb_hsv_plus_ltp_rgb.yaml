      object_init_sampler:
        _target_: tbp.monty.frameworks.environments.object_init_samplers.RandomRotation
    logging:
      monty_log_level: BASIC
      monty_handlers:
      - ${monty.class:tbp.monty.frameworks.loggers.monty_handlers.BasicCSVStatsHandler}
      wandb_handlers: []
      python_log_level: INFO
      python_log_to_file: true
      python_log_to_stderr: true
      output_dir: ${path.expanduser:${oc.env:MONTY_LOGS}/projects/evidence_eval_runs/logs}
      resume_wandb_run: false
      wandb_id:
        _target_: wandb.util.generate_id
      wandb_group: evidence_eval_runs
      run_name: eval_3dc_mixed_amb_hsv_plus_ltp_rgb
    show_sensor_output: false
    max_train_steps: 1000
    max_eval_steps: 500
    max_total_steps: 6000
    n_train_epochs: 3
    model_name_or_path: ${constants.retextured_pretrained_dir}/pretrain_3dc_mixed_amb_all_features/pretrained/
    n_eval_epochs: 5
    min_lms_match: 1
    seed: 42
    save_eval_models: false
    supervised_lm_ids: []
  _target_: tbp.monty.frameworks.experiments.object_recognition_experiments.MontyObjectRecognitionExperiment
