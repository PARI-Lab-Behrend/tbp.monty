# @package experiment.config.monty_config.learning_modules

# RGB-texture variant of evidence_1lm_nn5_dod0025_ltp. The `ltp_rgb` feature holds
# one LTP histogram per color channel and is scored with a single Hellinger distance,
# which works out to the root-mean-square of the three per-channel distances. It
# carries the same weight semantics as `ltp`, so `ltp_rgb: 1.0` is directly
# comparable to the grayscale config. The tolerance may still want retuning: pooling
# three channels changes the distribution of distances even though its range is the
# same [0, 1].

defaults:
  - hypotheses_updater/burst_sampling_5nn@learning_module_0

learning_module_0:
  _target_: tbp.monty.frameworks.models.evidence_matching.learning_module.EvidenceGraphLM
  feature_weights:
    patch:
      hsv: ${np.array:[0, 0.0, 0.0]}
      pose_vectors: ${np.ones:3}
      principal_curvatures_log: ${np.ones:2}
      ltp_rgb: 2.0
  tolerances:
    patch:
      hsv: ${np.array:[0.1, 0.2, 0.2]}
      principal_curvatures_log: ${np.ones:2}
      ltp_rgb: 0.5
  max_match_distance: 0.01
  x_percent_threshold: 20
  evidence_threshold_config: all
  max_graph_size: 0.3
  num_model_voxels_per_dim: 100
  gsg:
    _target_: tbp.monty.frameworks.models.goal_generation.EvidenceGoalGenerator
    goal_tolerances:
      location: 0.015
    elapsed_steps_factor: 10
    min_post_goal_success_steps: 5
    x_percent_scale_factor: 0.75
    desired_object_distance: 0.025
