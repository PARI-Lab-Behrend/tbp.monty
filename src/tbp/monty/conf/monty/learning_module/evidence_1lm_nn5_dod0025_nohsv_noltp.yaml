# @package experiment.config.monty_config.learning_modules

# Neither-feature learning module: HSV weight explicitly zeroed (see
# evidence_1lm_nn5_dod0025_ltp_nohsv.yaml for why zeroing rather than omitting
# matters), and no ltp key at all -- only the morphological features (pose vectors,
# principal curvatures) drive matching. Ablation-grid arm: the "neither" row that
# exists for YCB (Table 3) but was missing for YCB-11R.

defaults:
  - hypotheses_updater/burst_sampling_5nn@learning_module_0

learning_module_0:
  _target_: tbp.monty.frameworks.models.evidence_matching.learning_module.EvidenceGraphLM
  feature_weights:
    patch:
      hsv: ${np.array:[0, 0, 0]}
      pose_vectors: ${np.ones:3}
      principal_curvatures_log: ${np.ones:2}
  tolerances:
    patch:
      hsv: ${np.array:[0.1, 0.2, 0.2]}
      principal_curvatures_log: ${np.ones:2}
  max_match_distance: 0.01
  x_percent_threshold: 20
  evidence_threshold_config: all
  max_graph_size: 0.3
  num_model_voxels_per_dim: 100
  gsg:
    _target_: tbp.monty.frameworks.models.goal_generation.EvidenceGoalGenerator
    goal_tolerances:
      location: 0.015
    elapsed_steps_factor: 10
    min_post_goal_success_steps: 5
    x_percent_scale_factor: 0.75
    desired_object_distance: 0.025
