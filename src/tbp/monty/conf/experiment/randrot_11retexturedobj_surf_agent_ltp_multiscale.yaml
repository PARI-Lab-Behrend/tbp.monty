# @package _global_

# Eval variant of randrot_11retexturedobj_surf_agent_ltp that uses the multi-scale
# LTP histogram (ROR at radii 1/2/3). Requires the matching pretrained model from
# surf_pre_training_11retextured_obj_ltp_multiscale: the single-scale model's
# histograms have a different number of bins and will not match these observations.

defaults:
  - /monty: evidencegraph_exp1000_emin_t3_tot2500
  - /monty/motor_system_config: surface_curvature_informed_goal1
  - /monty/learning_module: evidence_1lm_nn5_dod0025_ltp
  - /monty/sensor_module: camera_surf_rgba_ltp_multiscale
  - /monty/connectivity: 1lm_1sm
  - /environment: retextured_surf_agent_semantics0
  - /env_interface: eval_retexturedobj_random
  - /env_interface/transform: missing_depthto3d_sensor2_semantic0_clip
  - /logging: basic_warning_wandb_monty_runs

experiment:
  _target_: tbp.monty.frameworks.experiments.object_recognition_experiments.MontyObjectRecognitionExperiment
  config:
    show_sensor_output: false
    max_train_steps: 1000
    max_eval_steps: 500
    max_total_steps: 6000
    n_train_epochs: 3
    model_name_or_path: ${constants.retextured_pretrained_dir}/surf_pre_training_11retextured_obj_ltp_multiscale/pretrained/
    n_eval_epochs: 10
    min_lms_match: 1
    seed: 42
    supervised_lm_ids: []
    python_log_level: DEBUG
    logging:
      run_name: randrot_11retexturedobj_surf_agent_ltp_multiscale_t050
