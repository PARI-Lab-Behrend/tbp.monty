# @package _global_

# Ambient 11retex RGB LTP eval arm. Loads the SAME COMBINED uniform+rgb model as the
# uniform arm and weights the `ltp_rgb` feature at 2.0 (evidence_1lm_nn5_dod0025_ltp_rgb_w2).
# The sensor module emits `ltp_rgb`; the model's stored grayscale `ltp` is ignored.
# 20 random rotations, seed 42 => paired with the other 11retex arms.

defaults:
  - /monty: evidencegraph_exp1000_emin_t3_tot2500
  - /monty/motor_system_config: surface_curvature_informed_goal1
  - /monty/learning_module: evidence_1lm_nn5_dod0025_ltp_rgb_w2
  - /monty/sensor_module: camera_surf_rgba_ltp_rgb_uniform
  - /monty/connectivity: 1lm_1sm
  - /environment: retextured_surf_agent_semantics0_amb
  - /env_interface: eval_retexturedobj_random
  - /env_interface/transform: missing_depthto3d_sensor2_semantic0_clip
  - /logging: basic_warning_wandb_monty_runs

experiment:
  _target_: tbp.monty.frameworks.experiments.object_recognition_experiments.MontyObjectRecognitionExperiment
  config:
    show_sensor_output: false
    max_train_steps: 1000
    max_eval_steps: 500
    max_total_steps: 6000
    n_train_epochs: 3
    model_name_or_path: ${constants.retextured_pretrained_dir}/amb_surf_pre_training_11retextured_obj_ltp_uniform_rgb/pretrained/
    n_eval_epochs: 20
    min_lms_match: 1
    seed: 42
    supervised_lm_ids: []
    python_log_level: DEBUG
    logging:
      run_name: pval_amb_11retex_surf_agent_ltp_rgb
