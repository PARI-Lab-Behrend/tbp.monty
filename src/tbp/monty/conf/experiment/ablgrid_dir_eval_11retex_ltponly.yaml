# @package _global_

# Ablation-grid arm: LTP-only, no HSV. YCB-11R, directional lighting.
# Completes Tier 3 "ablation grid" (revisions.md): this row exists for YCB
# (Table 3, tick/cross->ror) but was missing for YCB-11R. Reuses the LTP
# pretrained model (superset; HSV weight is zeroed at the learning-module level,
# see evidence_1lm_nn5_dod0025_ltp_nohsv). Seed 42, same RandomRotation env
# interface as the other YCB-11R directional arms, so episodes pair one-to-one.

defaults:
  - /monty: evidencegraph_exp1000_emin_t3_tot2500
  - /monty/motor_system_config: surface_curvature_informed_goal1
  - /monty/learning_module: evidence_1lm_nn5_dod0025_ltp_nohsv
  - /monty/sensor_module: camera_surf_rgba_ltp
  - /monty/connectivity: 1lm_1sm
  - /environment: retextured_surf_agent_semantics0
  - /env_interface: eval_retexturedobj_random
  - /env_interface/transform: missing_depthto3d_sensor2_semantic0_clip
  - /logging: basic_warning_wandb_monty_runs

experiment:
  _target_: tbp.monty.frameworks.experiments.object_recognition_experiments.MontyObjectRecognitionExperiment
  config:
    show_sensor_output: false
    max_train_steps: 1000
    max_eval_steps: 500
    max_total_steps: 6000
    n_train_epochs: 3
    model_name_or_path: ${constants.retextured_pretrained_dir}/surf_pre_training_11retextured_obj_ltp/pretrained/
    n_eval_epochs: 10
    min_lms_match: 1
    seed: 42
    supervised_lm_ids: []
    python_log_level: DEBUG
    logging:
      run_name: ablgrid_dir_eval_11retex_ltponly
